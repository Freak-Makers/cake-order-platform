name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install JDK21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create application-dev.yml
        working-directory: ./backend
        run: echo "${{ secrets.APPLICATION_PROPERTY_DEV }}" > ./src/main/resources/application-dev.yml

      - name: Build with Gradle
        working-directory: ./backend
        run: ./gradlew build -x test

      - name: 빌드된 파일 이름 변경하기
        run: mv ./backend/build/libs/cake-order-platform-0.0.1-SNAPSHOT.jar ./cake-order-platform-api.jar

      - name: SCP to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "cake-order-platform-api.jar"
          target: "/home/ubuntu"

      - name: Run deploy script on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: bash /home/ubuntu/deploy.sh