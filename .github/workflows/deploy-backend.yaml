name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install JDK21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create application-dev.yml
        run: |
          touch ./src/main/resources/application-dev.yml
          echo "${{ secrets.APPLICATION_PROPERTY_DEV }}" > ./src/main/resources/application-dev.yml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.2

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cake-order-platform-backend
          path: build/libs/cake-order-platform-0.0.1-SNAPSHOT.jar

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: cake-order-platform-backend
          path: build/libs/


      - name: Deploy to EC2
        run: |
          # EC2 접근을 위한 SSH 개인 키 저장 및 권한 설정
          echo "${{ secrets.EC2_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

          # EC2로 JAR 파일 복사
          scp -i private_key.pem -o StrictHostKeyChecking=no build/libs/cake-order-platform-0.0.1-SNAPSHOT.jar ${{ secrets.EC2_USERNAME }}@${{ secrets._EC2_HOST }}:/home/${{ secrets.EC2_USERNAME }}/cake-order-platform-SNAPSHOT.jar

          # EC2에서 기존 Java 프로세스 종료 후 새 애플리케이션 실행
          
          # 보안상 개인 키 삭제
          rm -f private_key.pem