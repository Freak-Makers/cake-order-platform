name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install JDK21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create application-dev.yml
        working-directory: ./backend
        run: echo "${{ secrets.APPLICATION_PROPERTY_DEV }}" > ./src/main/resources/application-dev.yml

      - name: Build with Gradle
        working-directory: ./backend
        run: ./gradlew build -x test

      - name: Set timestamp
        run: echo "TIMESTAMP=$(TZ='Asia/Seoul' date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: 빌드된 파일 이름 변경하기
        run: mv ./backend/build/libs/cake-order-platform-0.0.1-SNAPSHOT.jar ./cake-order-platform-api-${{ env.TIMESTAMP }}.jar

      - name: SCP to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "cake-order-platform-api-${{ env.TIMESTAMP }}.jar"
          target: "/home/ubuntu"