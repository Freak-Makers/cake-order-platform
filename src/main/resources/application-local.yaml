server:
  port: 8080

spring:
  application:
    name: cake-order-platform

  config:
    activate:
      on-profile: local

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:CAKE_ORDER_PLATFORM_DB;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:db/ddl.sql

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE # sql 파라미터 확인을 위함

kakao:
  client-id: \${KAKAO_CLIENT_ID:your-kakao-client-id}
  redirect-uri: \${KAKAO_REDIRECT_URI:http://localhost:3000/kakao/callback}